name: Build OpenRGB 1.1 with AERO RTX 5060 driver

on:
  workflow_dispatch:
  push:
    branches: [ main, feature/build-effects-plugin-api5 ]

jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - name: Check out this driver
        uses: actions/checkout@v4

      - name: Check out OpenRGB 1.1 source
        uses: actions/checkout@v4
        with:
          repository: CalcProgrammer1/OpenRGB
          ref: 8e16de27858cf2be6af54a33ce003df74cb9fd3e
          path: openrgb
          submodules: recursive

      - name: Add AERO RTX 5060 controller to OpenRGB
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force "driver/Controllers/GigabyteAERO5060Controller" "openrgb/Controllers/"

      - name: Instrument NVIDIA NvAPI I2C write failures
        shell: pwsh
        working-directory: openrgb
        run: |
          $file = "i2c_smbus/Windows/i2c_smbus_nvapi.cpp"
          $source = Get-Content $file -Raw
          $source = $source.Replace('#include "i2c_smbus_nvapi.h"', '#include "i2c_smbus_nvapi.h"' + "`n" + '#include "LogManager.h"')
          $old = @'
          ret = NvAPI_I2CWriteEx(handle, &i2c_data, &unknown);
          '@
          $new = @'
          ret = NvAPI_I2CWriteEx(handle, &i2c_data, &unknown);
                  if(ret != 0)
                  {
                      LOG_ERROR("[NvAPI I2C] NvAPI_I2CWriteEx failed: status=%d (0x%08X), addr7=0x%02X, addr8=0x%02X, size=%u, port=%u, is_ddc=%u, reg_addr_size=%u",
                                (int)ret, (unsigned int)ret, (unsigned int)addr,
                                (unsigned int)i2c_data.i2c_dev_address,
                                (unsigned int)i2c_data.size,
                                (unsigned int)i2c_data.port_id,
                                (unsigned int)i2c_data.is_ddc_port,
                                (unsigned int)i2c_data.reg_addr_size);
                  }
          '@
          if (-not $source.Contains($old)) { throw "NvAPI write call not found; refusing to build without diagnostics." }
          $source = $source.Replace($old, $new)
          Set-Content -Path $file -Value $source -NoNewline


      - name: Install MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qt5compat
          cache: true

      - name: Check out OpenRGB Effects Plugin 1.1 (Plugin API 5)
        shell: pwsh
        run: |
          git clone --depth 1 --branch release_1.1 --recurse-submodules https://gitlab.com/OpenRGBDevelopers/OpenRGBEffectsPlugin.git effects-plugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C effects-plugin rev-parse HEAD

      - name: Configure and compile OpenRGB
        shell: cmd
        working-directory: openrgb
        run: |
          qmake OpenRGB.pro CONFIG-=debug_and_release CONFIG+=release
          if errorlevel 1 exit /b %errorlevel%
          nmake
          if errorlevel 1 exit /b %errorlevel%

      - name: Use the exact OpenRGB 1.1 SDK for the Effects Plugin
        shell: pwsh
        run: |
          if (Test-Path "effects-plugin/OpenRGB") { Remove-Item -Recurse -Force "effects-plugin/OpenRGB" }
          New-Item -ItemType Directory -Force "effects-plugin/OpenRGB" | Out-Null
          robocopy "openrgb" "effects-plugin/OpenRGB" /E /XD ".git" "release"
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

      - name: Normalize plugin build metadata for MSVC
        shell: pwsh
        run: |
          $project = "effects-plugin/OpenRGBEffectsPlugin.pro"
          $source = Get-Content $project -Raw
          $dollar = [string][char]36 + [char]36
          $buildDate = "win32:BUILDDATE = " + $dollar + 'system(powershell -NoProfile -Command "Get-Date -Format yyyyMMdd")'
          $commitDate = "GIT_COMMIT_DATE = " + $dollar + 'system(git --git-dir $$_PRO_FILE_PWD_/.git --work-tree $$_PRO_FILE_PWD_ show -s --format=%cs HEAD)'
          $source = [regex]::Replace($source, '(?m)^win32:BUILDDATE\s*=.*$', $buildDate)
          $source = [regex]::Replace($source, '(?m)^GIT_COMMIT_DATE\s*=.*$', $commitDate)
          $source = $source.Replace('job=Windows 64', 'job=Windows%2064')
          if ($source -notmatch 'Get-Date -Format yyyyMMdd' -or $source -notmatch '--format=%cs HEAD' -or $source -match 'job=Windows 64') {
            throw "Could not normalize the space-containing build metadata in OpenRGBEffectsPlugin.pro"
          }
          Set-Content -Path $project -Value $source -NoNewline

      - name: Configure OpenRGB Effects Plugin
        shell: cmd
        run: |
          if not exist effects-plugin\OpenRGBEffectsPlugin.pro exit /b 1
          if not exist effects-plugin-build mkdir effects-plugin-build
          cd effects-plugin-build
          qmake ..\effects-plugin\OpenRGBEffectsPlugin.pro CONFIG-=debug_and_release CONFIG+=release
          if errorlevel 1 exit /b %errorlevel%
          if not exist _intermediate_release\.moc mkdir _intermediate_release\.moc
          if not exist _intermediate_release\.obj mkdir _intermediate_release\.obj
          if not exist _intermediate_release\.ui mkdir _intermediate_release\.ui
          if not exist _intermediate_release\.qrc mkdir _intermediate_release\.qrc

      - name: Compile OpenRGB Effects Plugin
        shell: cmd
        run: |
          cd effects-plugin-build
          nmake
          if errorlevel 1 exit /b %errorlevel%
          if not exist release\OpenRGBEffectsPlugin.dll exit /b 1
          copy /Y release\OpenRGBEffectsPlugin.dll ..\openrgb\release\OpenRGBEffectsPlugin.dll
          if errorlevel 1 exit /b %errorlevel%

      - name: Bundle Qt runtime
        shell: pwsh
        working-directory: openrgb
        run: |
          windeployqt --no-patchqt --no-quick-import --no-translations --no-system-d3d-compiler --no-compiler-runtime --no-opengl-sw --no-network .\release\
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6Core5Compat.dll" ".\release\" -ErrorAction SilentlyContinue
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6OpenGL.dll" ".\release\" -ErrorAction SilentlyContinue

      - name: Package corresponding GPL source
        shell: pwsh
        run: |
          tar -a -c -f "OpenRGB-1.1-AERO-RTX5060-source.zip" --exclude=.git --exclude=release -C openrgb .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          tar -a -c -f "OpenRGBEffectsPlugin-1.1-source.zip" --exclude=.git --exclude=release --exclude=OpenRGB -C effects-plugin .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload corresponding source
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-1.1-AERO-RTX5060-source
          path: |
            OpenRGB-1.1-AERO-RTX5060-source.zip
            OpenRGBEffectsPlugin-1.1-source.zip
            LICENSE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB-1.1-AERO-RTX5060-Windows-x64
          path: openrgb/release/
          if-no-files-found: error
